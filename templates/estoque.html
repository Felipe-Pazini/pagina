 <!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='estoque.css') }}">
</head>

<body>
    <nav class="navbar">

        <ul>
            <li><a href="/home">Home</a></li>
        </ul>

    </nav>

    <div class="container">

        <h1>Controle de Almoxarifado</h1>

        {% if session.get("cargo") == "admin" %}

        <form class="formulario" action="/adicionar" method="POST" enctype="multipart/form-data">

            <input
                type="text"
                name="nome"
                placeholder="Nome do produto"
                required>

            <input
                type="number"
                name="quantidade"
                placeholder="Quantidade"
                required>

            <input
                type="file"
                name="foto"
                accept="image/*">

            <button type="submit">
                Adicionar Produto
            </button>

        </form>

        {% endif %}

        <table>

            <thead>

                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>

                    {% if session.get("cargo") == "admin" %}
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Excluir</th>
                    {% endif %}
                </tr>

            </thead>

            <tbody id="tabelaProdutos">

            </tbody>

        </table>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
